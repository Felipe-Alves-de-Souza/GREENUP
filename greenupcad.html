<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #2e7d32,#b9dcb9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #2e7d32;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #388e3c;
    }

    .mensagem {
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
    }

    .sucesso {
      color: green;
    }

    .erro {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cadastro de Cliente</h2>

    <div class="form-group">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Digite seu nome">
    </div>

    <div class="form-group">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" placeholder="Digite seu CPF">
    </div>

    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" placeholder="(00) 00000-0000">
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="exemplo@email.com">
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha">
    </div>

    <div class="form-group">
      <label for="confirmaSenha">Confirmar Senha</label>
      <input type="password" id="confirmaSenha" placeholder="Confirme sua senha">
    </div>

    <button onclick="cadastrar()">Cadastrar</button>

    <div id="mensagem" class="mensagem"></div>
  </div>

  <script>
    function cadastrar() {
      const nome = document.getElementById("nome").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const confirmaSenha = document.getElementById("confirmaSenha").value.trim();
      const msg = document.getElementById("mensagem");

      msg.textContent = "";
      msg.className = "mensagem";

      if (!nome || !cpf || !telefone || !email || !senha || !confirmaSenha) {
        msg.textContent = "Por favor, preencha todos os campos.";
        msg.classList.add("erro");
        return;
      }

      if (senha !== confirmaSenha) {
        msg.textContent = "As senhas não coincidem.";
        msg.classList.add("erro");
        return;
      }

      msg.textContent = "Cadastro realizado com sucesso!";
      msg.classList.add("sucesso");

      // Limpa os campos após o sucesso
      document.querySelectorAll("input").forEach(i => i.value = "");
    }
  </script>
</body>
</html>
